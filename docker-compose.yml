# PostgreSQL with pgvector (relational and JSONB realizations) and Qdrant (vector realization).
#   docker compose up -d
#   DSN=postgresql://expreuse:expreuse@localhost:5432/expreuse   QDRANT_URL=http://localhost:6333
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: expreuse
      POSTGRES_PASSWORD: expreuse
      POSTGRES_DB: expreuse
    ports:
      - "5432:5432"
  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports:
      - "6333:6333"
